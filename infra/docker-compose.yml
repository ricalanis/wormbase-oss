# WormBase local development services.
#
# This compose file brings up Postgres for the ledger, the OpenClaw
# gateway for channel adapters, and the worm-core runtime hub. Most
# services declare real images and expose real ports; some container
# entrypoints are stubs that no-op until the rest of the stack is wired.
# `docker compose config` validates clean.
#
# The OpenClaw image tag below is provisional pending a license review.
# When the license disposition is finalized the tag will be pinned
# to a specific upstream release or built from source.

name: wormbase

services:
  postgres:
    image: postgres:16
    container_name: wormbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wormbase
      POSTGRES_PASSWORD: wormbase
      POSTGRES_DB: wormbase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wormbase -d wormbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    container_name: wormbase-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: spike-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: ["vault", "server", "-dev", "-dev-root-token-id=spike-root", "-dev-listen-address=0.0.0.0:8200"]

  openclaw:
    # OpenClaw Gateway — multi-tenant chat layer (Slack today; Discord/Teams in scope).
    # Built from `infra/openclaw/Dockerfile` (npm install of openclaw@latest, MIT).
    # Multi-tenancy: ONE container serves MANY tenants via
    # `channels.slack.accounts.<companyId>` blocks in config.json5.
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    image: wormbase-openclaw:local
    container_name: wormbase-openclaw
    restart: unless-stopped
    # Entrypoint (baked into image) applies wormbase config via
    # `openclaw config set` then exec's the gateway. Tenant tokens flow
    # through OpenClaw's native SecretRef pattern (env-bound, never
    # hardcoded into config files). See infra/openclaw/entrypoint.sh.
    ports:
      - "18789:18789"
    volumes:
      - openclaw-state:/root/.openclaw
      # Path 3 capture path: OpenClaw writes its daily global log
      # (openclaw-YYYY-MM-DD.log) to /tmp/openclaw inside the container;
      # the channel-adapter mounts the same volume read-only and tails
      # that file to derive deterministic per-event channel-admit signals.
      - openclaw-tmp:/tmp/openclaw
      # Hackathon: mount entrypoint as bind so we can iterate on config
      # without rebuilding the image. Bake it back into the image once
      # the config is stable (revert this volume + restore COPY in Dockerfile).
      # Path is relative to project root (set via Makefile --project-directory .)
      - ./infra/openclaw/entrypoint.sh:/usr/local/bin/wormbase-entrypoint.sh:ro
    environment:
      # Admin token for channel-adapter ↔ OpenClaw bridge auth.
      OPENCLAW_ADMIN_TOKEN: ${OPENCLAW_ADMIN_TOKEN:-dev-token}
      # Per-tenant Slack tokens — add new tenants by appending to .env
      # using the same pattern: SLACK_APP_TOKEN_<COMPANY_ID> / SLACK_BOT_TOKEN_<COMPANY_ID>.
      # Demo tenant matches the workspace identity baseworm.slack.com.
      SLACK_APP_TOKEN_BASEWORM: ${SLACK_APP_TOKEN_BASEWORM:-}
      SLACK_BOT_TOKEN_BASEWORM: ${SLACK_BOT_TOKEN_BASEWORM:-}
      # WhatsApp via OpenClaw Baileys (preview). Defaults to disabled —
      # the entrypoint omits the channels.whatsapp block entirely unless
      # WHATSAPP_ENABLED_BASEWORM=true. Auth is QR pairing at runtime
      # (see infra/openclaw/WHATSAPP_PAIRING.md), not config-time tokens,
      # so this block carries policy only:
      #   - dmPolicy: 'pairing' | 'open' | 'allowlist'
      #   - groupPolicy: 'allowlist' | 'open'
      #   - allowFrom: comma-separated E.164 (e.g. "5511999999999,5511888888888")
      #   - groupAllowFrom: comma-separated jids (e.g. "120363012345...@g.us")
      # ToS caveat: Baileys is unofficial; only use on dedicated test
      # numbers, never production CEO numbers.
      WHATSAPP_ENABLED_BASEWORM: ${WHATSAPP_ENABLED_BASEWORM:-}
      WHATSAPP_DM_POLICY_BASEWORM: ${WHATSAPP_DM_POLICY_BASEWORM:-pairing}
      WHATSAPP_GROUP_POLICY_BASEWORM: ${WHATSAPP_GROUP_POLICY_BASEWORM:-allowlist}
      WHATSAPP_ALLOW_FROM_BASEWORM: ${WHATSAPP_ALLOW_FROM_BASEWORM:-}
      WHATSAPP_GROUP_ALLOW_FROM_BASEWORM: ${WHATSAPP_GROUP_ALLOW_FROM_BASEWORM:-}
      # Ollama Cloud — primary provider. Hosts kimi-k2.6:cloud (primary)
      # and gpt-oss:120b (fallback). Also serves worm-core's own-inference layer.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # OpenClaw's bonjour plugin throws "CIAO PROBING CANCELLED" on
      # container networks that can't run mDNS. The throw is recoverable
      # but Node 24's default is to crash on unhandled rejections, which
      # restart-loops the container. Suppress with --unhandled-rejections=none.
      NODE_OPTIONS: "--unhandled-rejections=none"
      # Moonshot direct — optional, only if config.json5 activates the
      # commented moonshot block for strict-direct K2.6.
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
    # W7.A2 — compose-level healthcheck (overrides the Dockerfile's HEALTHCHECK
    # because the upstream image's `wget http://localhost:18789/health`
    # double-fails: (a) `localhost` resolves to `::1` first and OpenClaw
    # only binds IPv4, and (b) OpenClaw does NOT expose `/health` —
    # only the control-UI HTML at `/`. We probe `127.0.0.1:18789/` and
    # accept the 200 OK on the control UI as the liveness signal: it
    # proves the Node process is up, the HTTP server is bound, and the
    # event loop is responsive. SocketMode pairing happens in a separate
    # task so probing it directly would race container boot.
    #
    # `start_period: 90s` covers cold-boot: npm-fetched native modules
    # + Slack SocketMode handshake routinely take 30-60s on the first
    # boot of the day.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:18789/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    # `deploy.restart_policy` caps auto-restart attempts so a
    # genuinely-broken openclaw (config drift, expired token, repeating
    # crash) halts after N failures instead of looping forever and
    # masking the real bug. Modern compose v2 honors this block even
    # outside swarm and uses it to set the container's HostConfig
    # RestartPolicy, overriding the `restart:` field above.
    #
    # The Docker engine API only supports `MaximumRetryCount` with the
    # `on-failure` policy — `condition: any + max_attempts` is rejected
    # at runtime ("invalid restart policy"). So `on-failure` it is.
    # Coverage gap: a deliberate `docker stop` is not a "failure" and
    # won't auto-restart, but that's the desired semantic (an operator
    # who stopped the container meant to). Process crashes (non-zero
    # exit, kernel OOM-kill, native fault) all trigger restart up to 3x.
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    depends_on:
      postgres:
        condition: service_healthy

  hermes:
    # Hermes Agent — H1 spike (DEFERRED 2026-04-27: NO-GO).
    #
    # Per docs/superpowers/notes/2026-04-27-hermes-h1-spike.md, the H1
    # spike returned NO-GO: Hermes v0.11.0's file-based hook system fires
    # only on agent-engagement events (mention/DM/target channel), not
    # on every inbound message. WormBase's lurker mines passively. The
    # migration is deferred indefinitely; OpenClaw remains the gateway.
    #
    # This service is preserved as a reproducible spike snapshot. It is
    # GATED behind the `hermes-spike` compose profile so it does NOT
    # start by default. To bring it back up:
    #     docker compose --profile hermes-spike up -d hermes channel-adapter-hermes-spike
    # To remove entirely (when Hermes ships an inbound_message hook,
    # or if you want to reclaim the disk): delete the `hermes:` service
    # block + `channel-adapter-hermes-spike:` + `hermes-state` volume,
    # plus `infra/hermes/` and `apps/channel-adapter/.../spike_hermes.py`.
    profiles: ["hermes-spike"]
    #
    # ORIGINAL spike rationale (kept as record):
    # Per docs/superpowers/specs/2026-04-27-openclaw-to-hermes-migration.md
    # §5 Phase 0: stand up alongside the existing OpenClaw service so we
    # can verify pre-agent hook firing without disturbing the production
    # capture path. Hermes is ADDITIVE here — OpenClaw stays the canonical
    # ingest until H2/H3 land. Stopping this service rolls the spike back
    # cleanly.
    #
    # Image: NousResearch/hermes-agent v0.11.0 (MIT, Python). Hermes is
    # not on PyPI; the Dockerfile clones the upstream tag and runs
    # `uv pip install -e .[all]`.
    #
    # Multi-tenancy: Hermes uses ONE app token + per-workspace bot
    # tokens (comma-separated SLACK_BOT_TOKEN list, or
    # ~/.hermes/slack_tokens.json). The spike is single-tenant
    # (`baseworm`); we pass the same SLACK_*_BASEWORM env vars OpenClaw
    # uses today.
    #
    # Hooks: ~/.hermes/hooks/ is rendered into the named volume by the
    # entrypoint. The wire-tap hook (infra/hermes/hooks/wire-tap/) is
    # bind-mounted into /opt/hermes/spike-hook for fast iteration.
    build:
      # Path is relative to project-root (Makefile sets --project-directory .).
      context: ./infra/hermes
      dockerfile: Dockerfile
    image: wormbase-hermes:local
    container_name: wormbase-hermes
    restart: unless-stopped
    # Hermes binds 9120 (chosen distinct from OpenClaw's 18789 and from
    # the channel-adapter spike endpoint's 18790). The gateway itself
    # doesn't bind a TCP port unless API_SERVER_HOST is set; this entry
    # is here for healthcheck parity, not to expose Slack-bound traffic.
    ports:
      - "9120:9120"
    volumes:
      # Hermes home — config, logs, slack_tokens.json. Persisted across
      # restarts so the gateway doesn't re-pair on every bounce.
      - hermes-state:/opt/data
      # Bind the wire-tap hook for fast iteration during the spike.
      # entrypoint.sh copies it into the volume on each boot, so a
      # container crash doesn't lose the hook. Path is relative to
      # project-root (Makefile sets --project-directory .).
      - ./infra/hermes/hooks/wire-tap:/opt/hermes/spike-hook:ro
      # Bind entrypoint for iteration during the spike (same pattern as
      # the OpenClaw service above).
      - ./infra/hermes/entrypoint.sh:/usr/local/bin/wormbase-hermes-entrypoint.sh:ro
    environment:
      # Spike target — the POST destination for the wire-tap hook. The
      # `channel-adapter-hermes-spike` sidecar (defined below) exposes
      # /hermes-spike on port 18790. We use the sidecar's service name
      # directly to avoid a DNS-alias collision with the production
      # `channel-adapter` container (which runs the OpenClaw consumer
      # and does NOT bind 18790).
      WORMBASE_HERMES_SPIKE_ENDPOINT: ${WORMBASE_HERMES_SPIKE_ENDPOINT:-http://channel-adapter-hermes-spike:18790/hermes-spike}
      WORMBASE_TENANT_ID: ${WORMBASE_TENANT_ID:-baseworm}
      # Same Slack credentials OpenClaw uses today — we run the two
      # gateways against the same workspace tokens for the spike. Note:
      # both gateways will SocketMode-connect; Slack delivers events
      # round-robin across SocketMode peers within an app, but each app
      # gets its own copy. If H1 reveals capture races between OpenClaw
      # and Hermes, we'll register Hermes against a separate Slack app
      # for H2.
      SLACK_APP_TOKEN_BASEWORM: ${SLACK_APP_TOKEN_BASEWORM:-}
      SLACK_BOT_TOKEN_BASEWORM: ${SLACK_BOT_TOKEN_BASEWORM:-}
    depends_on:
      postgres:
        condition: service_healthy

  channel-adapter-hermes-spike:
    # H1 spike sidecar — runs the channel-adapter image with the
    # `hermes-spike` subcommand instead of `run`. This is the POST
    # endpoint Hermes's wire-tap hook talks to.
    #
    # DEFERRED 2026-04-27 alongside the `hermes` service (see notes file
    # 2026-04-27-hermes-h1-spike.md). Profile-gated so it doesn't auto-start.
    profiles: ["hermes-spike"]
    #
    # Service name `channel-adapter-hermes-spike` (not `channel-adapter`)
    # to keep the production OpenClaw consumer fully isolated. Hermes's
    # wire-tap hook reaches this sidecar via the explicit
    # WORMBASE_HERMES_SPIKE_ENDPOINT env var (set on the `hermes` service
    # above) — we deliberately do NOT alias this to `channel-adapter`
    # because that hostname is owned by the production container.
    image: wormbase-channel-adapter:local
    container_name: wormbase-channel-adapter-hermes-spike
    restart: unless-stopped
    command: ["hermes-spike"]
    ports:
      - "18790:18790"
    environment:
      WORMBASE_HERMES_SPIKE_SINK: /var/log/wormbase/hermes-spike.jsonl
      WORMBASE_HERMES_SPIKE_HOST: 0.0.0.0
      WORMBASE_HERMES_SPIKE_PORT: "18790"
    volumes:
      # Mount the spike sink as a named volume so the host (and other
      # services like sim-harness) can introspect the JSONL.
      - hermes-spike-log:/var/log/wormbase
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    # WormBase dashboard — Next.js 15 App Router, Field Notebook design system.
    # Phase 4 wires real ledger reads through `apps/dashboard/lib/ledger-client.ts`;
    # the client tries Postgres via DATABASE_URL and falls back to a deterministic
    # demo fixture when the projection tables are not yet populated. The dev
    # server runs in-container with the source bind-mounted for live reload.
    image: node:22
    container_name: wormbase-dashboard
    working_dir: /workspace/apps/dashboard
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      # With --project-directory . (set by Makefile), `./` resolves to the
      # repo root — which contains pnpm-workspace.yaml + package.json that
      # Next.js's pnpm dev step needs to find.
      - ./:/workspace:cached
      - dashboard-node-modules:/workspace/node_modules
      - dashboard-next-cache:/workspace/apps/dashboard/.next
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wormbase:wormbase@postgres:5432/wormbase
      WORMBASE_TENANT_ID: ${WORMBASE_TENANT_ID:-baseworm}
      # A3.5 — server-side fetch helper (apps/dashboard/lib/server/worm-core-write.ts)
      # calls worm-core's HTTP write API. The dashboard ONLY uses this token
      # server-side; it is never sent to the browser. Development default;
      # rotate before any production deployment.
      WORMBASE_LEDGER_API_BASE: ${WORMBASE_LEDGER_API_BASE:-http://worm-core:8910}
      WORMBASE_LEDGER_API_TOKEN: ${WORMBASE_LEDGER_API_TOKEN:-dev-only-token-rotate-in-prod}
      # Block J — /mcp tab catalog source. The dashboard's getMcpCatalog()
      # accessor fetches this URL server-side; the worm-core endpoint is
      # read-only and gated on WORMBASE_MCP_ENABLED. With MCP disabled,
      # the endpoint 404s and the panel renders the honest empty state.
      WORMBASE_MCP_CATALOG_URL: ${WORMBASE_MCP_CATALOG_URL:-http://worm-core:8910/mcp/catalog}
      # W1.A4 — production OAuth env. The dashboard's
      # /onboarding/oauth/slack/{start,callback} routes read these. With
      # SLACK_CLIENT_ID unset, the start handler honestly redirects with
      # `?error=slack_not_configured`. WORMBASE_DASHBOARD_URL is the
      # public origin Slack should redirect back to (localhost in dev,
      # tunnel hostname in test, real domain in prod).
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      WORMBASE_DASHBOARD_URL: ${WORMBASE_DASHBOARD_URL:-http://localhost:3000}
      # W1.A4 — also expose the BASEWORM bot token to the dashboard
      # service so the install helper's optional vault-write fallback
      # (vault://local-dev/...) can verify a pre-issued token round-trips
      # against Slack's auth.test in dev. Same xoxb token the
      # channel-adapter, worm-core, and sim-harness already see.
      SLACK_BOT_TOKEN_BASEWORM: ${SLACK_BOT_TOKEN_BASEWORM:-}
      # W3.A12 — server-side proxy in /api/v1/voice/ask reaches the
      # voice-agent's /v1/ask endpoint over the compose network. The
      # browser never sees this URL; the floater talks to the dashboard
      # which talks to voice-agent. Honest "service unavailable" is
      # surfaced when the upstream is down — no fixture fallback.
      WORMBASE_VOICE_AGENT_URL: ${WORMBASE_VOICE_AGENT_URL:-http://voice-agent:8090}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  worm-core:
    # WormBase worm-core service — reactivity triad + Slack lurker +
    # source-building flows + ramp heartbeat + autoresearch loop +
    # HTTP write API (A3.5) on port 8910.
    build:
      context: .
      dockerfile: apps/worm-core/Dockerfile
    image: wormbase-worm-core:local
    container_name: wormbase-worm-core
    restart: unless-stopped
    ports:
      # A3.5 — HTTP write API (aiohttp). The dashboard server-side
      # process calls /api/v1/people/* on this port to write hash-chained
      # PEVR cycles into the ledger. Bearer-token authed via
      # WORMBASE_LEDGER_API_TOKEN.
      - "8910:8910"
      # MCP integration (Phase 0 spike — 2026-04-27 mcp-integration spec).
      # FastMCP Streamable HTTP server at /mcp. Only binds when
      # WORMBASE_MCP_ENABLED=1; otherwise the port is exposed but nothing
      # listens on it (no harm). Bearer-token authed via the same
      # WORMBASE_LEDGER_API_TOKEN as the write API.
      - "${WORMBASE_MCP_PORT:-9911}:${WORMBASE_MCP_PORT:-9911}"
    environment:
      WORMBASE_LEDGER_DSN: postgresql+asyncpg://wormbase:wormbase@postgres:5432/wormbase
      WORMBASE_TENANT_ID: ${WORMBASE_TENANT_ID:-baseworm}
      WORM_CORE_LOOP_INTERVAL_S: ${WORM_CORE_LOOP_INTERVAL_S:-5}
      WORM_CORE_LOG_LEVEL: ${WORM_CORE_LOG_LEVEL:-INFO}
      ONTOLOGY_SEED_PATH: /opt/wormbase/ontology-seed
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # A3.5 — bearer token for the worm-core HTTP write API. Hackathon-
      # grade: rotate before any non-demo deployment. Worm-core refuses
      # to start the HTTP server if this is unset (auth-only is non-
      # negotiable; the endpoint mints hash-chained ledger entries).
      WORMBASE_LEDGER_API_TOKEN: ${WORMBASE_LEDGER_API_TOKEN:-dev-only-token-rotate-in-prod}
      WORMBASE_LEDGER_API_PORT: "8910"
      # MCP server (Phase 0 spike) — opt-in. Default OFF. Set
      # WORMBASE_MCP_ENABLED=1 in .env to bring up the FastMCP server
      # on port 9911 alongside the existing services. Per
      # docs/superpowers/notes/2026-04-27-mcp-phase-0-spike.md.
      WORMBASE_MCP_ENABLED: ${WORMBASE_MCP_ENABLED:-0}
      WORMBASE_MCP_PORT: ${WORMBASE_MCP_PORT:-9911}
      # F6 — object storage for data product / notebook artifact bytes.
      # LocalStack S3 in dev; swap WORMBASE_OBJECT_STORE_URI to a real
      # bucket in prod. AWS_ENDPOINT_URL_S3 redirects boto3 → LocalStack.
      WORMBASE_OBJECT_STORE_URI: ${WORMBASE_OBJECT_STORE_URI:-s3://wormbase-dev/}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://localstack:4566}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Two-app architecture: the lurker uses a SEPARATE Slack app
      # (WormBase Observer) so its SocketMode connection doesn't
      # load-balance with OpenClaw's connection. Each Slack app delivers
      # every event independently, giving us deterministic 100% capture.
      # The OBSERVER tokens are preferred; the original BASEWORM tokens
      # remain as a fallback for tests/single-app dev environments.
      SLACK_APP_TOKEN_OBSERVER_BASEWORM: ${SLACK_APP_TOKEN_OBSERVER_BASEWORM:-}
      SLACK_BOT_TOKEN_OBSERVER_BASEWORM: ${SLACK_BOT_TOKEN_OBSERVER_BASEWORM:-}
      SLACK_APP_TOKEN_BASEWORM: ${SLACK_APP_TOKEN_BASEWORM:-}
      SLACK_BOT_TOKEN_BASEWORM: ${SLACK_BOT_TOKEN_BASEWORM:-}
      # Path 3: capture is owned by channel-adapter (OpenClaw log tail
      # + Slack Web API). worm-core sees inbound chat by polling
      # Postgres for new chat_received ledger entries, so the lurker's
      # second SocketMode connection is unnecessary and wasteful.
      WORMBASE_DISABLE_LURKER_SOCKET: "1"
    volumes:
      # Mount the ontology-seed YAML pack read-only so the loader can
      # find updated concept catalogs without a rebuild.
      - ./packages/ontology-seed/data:/opt/wormbase/ontology-seed:ro
    depends_on:
      postgres:
        condition: service_healthy

  channel-adapter:
    # WormBase channel-ledger adapter — tails OpenClaw session JSONL
    # files from the openclaw-state volume and writes chat_received /
    # chat_sent ledger entries via wormbase_ledger.
    build:
      # context is resolved relative to --project-directory (= wormbase
      # project root, set by the Makefile), so '.' is what we want.
      context: .
      dockerfile: apps/channel-adapter/Dockerfile
    image: wormbase-channel-adapter:local
    container_name: wormbase-channel-adapter
    restart: unless-stopped
    environment:
      WORMBASE_LEDGER_DSN: postgresql+asyncpg://wormbase:wormbase@postgres:5432/wormbase
      OPENCLAW_SESSIONS_PATH: /openclaw-state/agents/main/sessions
      WORMBASE_ADAPTER_STATE_PATH: /var/lib/wormbase-channel-adapter/state.json
      WORMBASE_TENANT_ID: baseworm
      # Path 3 capture path — directory is the openclaw-tmp shared volume
      # mounted below. OpenClaw writes openclaw-YYYY-MM-DD.log here.
      OPENCLAW_LOG_DIR: /openclaw-runtime-log
      # Slack Bot Token for the openclaw-log capture path. The adapter
      # uses this to call conversations.history when it sees a
      # `slack: allow channel <CID>` line — the log line only carries
      # the channel id, so we fetch the full message via the Web API.
      SLACK_BOT_TOKEN_BASEWORM: ${SLACK_BOT_TOKEN_BASEWORM:-}
      # WhatsApp wire-up — only activates when WHATSAPP_ACCOUNT_ID is set.
      # Pairing + bot-phone resolution happen via the openclaw container
      # (see infra/openclaw/WHATSAPP_PAIRING.md).
      WHATSAPP_ACCOUNT_ID: ${WHATSAPP_ACCOUNT_ID:-}
      WORMBASE_WHATSAPP_BOT_PHONE_BASEWORM: ${WORMBASE_WHATSAPP_BOT_PHONE_BASEWORM:-}
    volumes:
      # Read-only mount of OpenClaw's persistent volume (which holds the
      # session JSONL files we tail).
      - openclaw-state:/openclaw-state:ro
      # Read-only mount of OpenClaw's runtime log volume so the global
      # log tailer can observe every Slack admit decision deterministically.
      - openclaw-tmp:/openclaw-runtime-log:ro
      # Per-restart durable state (byte offsets) so we don't re-emit
      # ledger entries on container restart.
      - channel-adapter-state:/var/lib/wormbase-channel-adapter
    depends_on:
      postgres:
        condition: service_healthy
      openclaw:
        condition: service_started

  voice-agent:
    # WormBase voice-agent — ElevenLabs custom-LLM webhook bridge.
    # Receives ElevenLabs Conversational AI per-turn webhooks, routes
    # the user's transcribed utterance through Kimi via Ollama Cloud,
    # and writes chat_received / chat_sent ledger entries tagged with
    # modality=voice. See apps/voice-agent/README.md and the W1.A
    # design doc at docs/superpowers/specs/2026-04-26-voice-agent-design.md.
    build:
      # context resolves to the wormbase project root via Makefile
      # `--project-directory .`, so workspace deps are visible.
      context: .
      dockerfile: apps/voice-agent/Dockerfile
    image: wormbase-voice-agent:local
    container_name: wormbase-voice-agent
    restart: unless-stopped
    command: ["serve", "--port", "8090"]
    ports:
      - "8090:8090"
    environment:
      WORMBASE_LEDGER_DSN: postgresql+asyncpg://wormbase:wormbase@postgres:5432/wormbase
      WORMBASE_TENANT_ID: ${WORMBASE_TENANT_ID:-baseworm}
      # Ollama Cloud — primary route is kimi-k2.6:cloud, fallback gpt-oss:120b.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # ElevenLabs Conversational AI agent identifiers — copy from the
      # ElevenLabs console after creating the agent and pointing its
      # custom-LLM webhook at http(s)://<host>:8090/webhook/elevenlabs.
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ELEVENLABS_AGENT_TOKEN: ${ELEVENLABS_AGENT_TOKEN:-}
      WORMBASE_VOICE_AUDIO_DIR: /tmp/voice-audio
    volumes:
      - voice-audio:/tmp/voice-audio
    depends_on:
      postgres:
        condition: service_healthy

  sim-harness:
    # WormBase sim harness — scenario-driven multi-persona Slack poster.
    # Does NOT auto-run; the default command prints help so `make up`
    # never kicks off a demo unintentionally. Invoke via `make demo`
    # or `docker compose run --rm sim-harness wormbase demo run ...`.
    build:
      context: .
      dockerfile: apps/sim-harness/Dockerfile
    image: wormbase-sim-harness:local
    container_name: wormbase-sim-harness
    # Don't restart — this container is one-shot per demo run.
    restart: "no"
    command: ["wormbase", "--help"]
    environment:
      WORMBASE_LEDGER_DSN: postgresql+asyncpg://wormbase:wormbase@postgres:5432/wormbase
      WORMBASE_TENANT_ID: ${WORMBASE_TENANT_ID:-baseworm}
      WORMBASE_SIM_HARNESS_ROOT: /workspace/apps/sim-harness
      # Sim Slack app — separate from the BASEWORM (OpenClaw) and
      # OBSERVER (worm-core lurker) apps. Has chat:write.customize so
      # one bot can post under multiple persona usernames + icons.
      SLACK_BOT_TOKEN_SIM_BASEWORM: ${SLACK_BOT_TOKEN_SIM_BASEWORM:-}
      # Translate scenario @WormBase text → <@USER_ID> mention so the
      # OpenClaw agent's app_mention path fires.
      WORMBASE_AGENT_USER_ID: ${WORMBASE_AGENT_USER_ID:-}
      WORMBASE_AGENT_HANDLE: ${WORMBASE_AGENT_HANDLE:-@WormBase}
      # Block A3.5 worm-core write API — sim-harness uses this for E5's
      # persona seeding via /api/v1/people. Token defaults to the dev
      # rotate-in-prod sentinel; base URL points at the worm-core service.
      WORMBASE_LEDGER_API_BASE: ${WORMBASE_LEDGER_API_BASE:-http://worm-core:8910}
      WORMBASE_LEDGER_API_TOKEN: ${WORMBASE_LEDGER_API_TOKEN:-dev-only-token-rotate-in-prod}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENCLAW_HOST: openclaw
      OPENCLAW_PORT: "18789"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      # Live-mount personas / scenarios / fixtures so iterating on the
      # demo arc doesn't require a rebuild. The bind path is relative
      # to the project root (Makefile sets --project-directory .).
      - ./apps/sim-harness/personas.yml:/workspace/apps/sim-harness/personas.yml:ro
      - ./apps/sim-harness/scenarios:/workspace/apps/sim-harness/scenarios:ro
      - ./apps/sim-harness/fixtures:/workspace/apps/sim-harness/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy

  tunnel:
    # Cloudflared quick-tunnel sidecar (W1.A2).
    #
    # Free `trycloudflare.com` HTTPS quick-tunnel — no Cloudflare
    # account needed. Exposes the dashboard service at a rotating
    # https://*.trycloudflare.com URL so Slack OAuth (and any other
    # public-callback flow) "just works" without manual ngrok setup.
    #
    # Profile-gated: this service does NOT start with `make up`. Bring
    # it up explicitly via `make tunnel`. Tear down via `make tunnel-down`.
    #
    # The cross-container handshake works through the `wormbase-tunnel-state`
    # named volume mounted at /shared:
    #   1. Dockerfile.tunnel runs cloudflared and tees stdout into
    #      /shared/tunnel.log.
    #   2. infra/scripts/wait-for-tunnel.sh greps the log for the
    #      assigned URL and writes /shared/tunnel.url.
    #   3. infra/scripts/sync-tunnel-to-env.sh reads /shared/tunnel.url
    #      and upserts WORMBASE_DASHBOARD_URL=... into .env.tunnel.
    #
    # The dashboard service env wiring (env_file: .env.tunnel) is owned
    # by sister task A4; this block only produces the URL, it does not
    # consume it.
    #
    # See docs/setup/tunnel.md for trade-offs vs ngrok / named tunnels
    # / production deploys, including the per-restart URL-rotation
    # caveat.
    profiles: ["oauth"]
    build:
      # context resolves to the project root (Makefile sets
      # --project-directory .), so the Dockerfile path below is correct.
      context: .
      dockerfile: infra/Dockerfile.tunnel
    image: wormbase-tunnel:local
    container_name: wormbase-tunnel
    restart: unless-stopped
    # No host port mapping needed — cloudflared dials OUT to Cloudflare's
    # edge, then proxies inbound traffic to dashboard:3000 over the
    # internal compose network. Metrics endpoint stays container-local.
    volumes:
      - wormbase-tunnel-state:/shared
    depends_on:
      # The tunnel needs the dashboard reachable on the compose network
      # before it can proxy. We don't gate on a healthcheck because the
      # dashboard service uses a bind-mounted pnpm install whose first
      # boot can take 30-60s; cloudflared itself retries until the
      # upstream is ready.
      - dashboard

  # LocalStack — S3-compatible object store for data product / notebook
  # artifact bytes (Block F6). Path scheme:
  #   s3://wormbase-dev/{tenant_id}/data-products/{artifact_id}/{run_id}.{ext}
  # The init container creates the bucket on first boot.
  localstack:
    image: localstack/localstack:3
    container_name: wormbase-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Init: ensure the wormbase-dev bucket exists. Runs once and exits.
  localstack-init:
    image: amazon/aws-cli:2.17.0
    container_name: wormbase-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - sh
      - -c
      - |
        aws --endpoint-url=http://localstack:4566 s3 mb s3://wormbase-dev || true
        echo "wormbase-dev bucket ready"

volumes:
  postgres-data:
    name: wormbase-postgres-data
  openclaw-state:
    name: wormbase-openclaw-state
  # Shared between openclaw (writer) and channel-adapter (reader) so
  # the Path 3 OpenClaw-log tailer sees daily openclaw-*.log files.
  openclaw-tmp:
    name: wormbase-openclaw-tmp
  channel-adapter-state:
    name: wormbase-channel-adapter-state
  dashboard-node-modules:
    name: wormbase-dashboard-node-modules
  dashboard-next-cache:
    name: wormbase-dashboard-next-cache
  voice-audio:
    name: wormbase-voice-audio
  localstack-data:
    name: wormbase-localstack-data
  # H1 spike — Hermes home (config, logs, slack_tokens.json,
  # ~/.hermes/hooks/). Persisted across restarts so we don't re-pair
  # on every bounce. Removed alongside the spike when H6 retires
  # OpenClaw and Hermes becomes the production gateway.
  hermes-state:
    name: wormbase-hermes-state
  # H1 spike — JSONL sink the wire-tap hook writes through. The spike
  # note's diff scripts read this directly. Removed when H2 lands the
  # production HermesEventConsumer (which writes ledger entries instead
  # of JSONL).
  hermes-spike-log:
    name: wormbase-hermes-spike-log
  # W1.A2 — cross-container handshake volume between the tunnel sidecar
  # (writer of /shared/tunnel.log + /shared/tunnel.url) and the host-side
  # wait-for-tunnel.sh / sync-tunnel-to-env.sh helpers (readers via
  # `compose exec`). Cleaned up by `make tunnel-down`.
  wormbase-tunnel-state:
    name: wormbase-tunnel-state
