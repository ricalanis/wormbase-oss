[project]
name = "wormbase-ledger"
version = "0.1.0"
description = "WormBase event-sourced ledger — hash chain, write primitive, replay."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "uuid-utils>=0.9",
    "click>=8.1",
    # pgvector is imported by the v016 + v017 migrations only in the
    # postgres branch — sqlite tests skip the import — but production
    # deploys need the wheel resolvable at install time. Latest on PyPI
    # is 0.4.x as of 2026-05; pin a floor that ships the
    # ``pgvector.sqlalchemy.Vector`` surface our migrations use.
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# Renamed from `wormbase` to avoid collision with sim-harness's
# `wormbase demo …` CLI. The ledger CLI is invoked as
# `wormbase-ledger verify` / `wormbase-ledger replay`.
wormbase-ledger = "wormbase_ledger.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services",
    "reproducibility: hash-chain and replay determinism tests",
    "service: single-service integration with real dependencies",
    "demo: demo gate / acceptance criteria tests",
    "slow: tests that take >5s",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_ledger"]
