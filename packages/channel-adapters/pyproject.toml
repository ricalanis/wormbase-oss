[project]
name = "wormbase-channel-adapters"
version = "0.1.0"
description = "WormBase ChannelAdapter Protocol + day-one adapters (slack, discord, teams, ...)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "slack-sdk>=3.27",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services",
    "service: single-service integration with real dependencies",
    "slow: tests that take >5s",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_channel_adapters"]
