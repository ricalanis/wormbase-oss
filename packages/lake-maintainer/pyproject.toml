[project]
name = "wormbase-lake-maintainer"
version = "0.1.0"
description = "Lake-maintenance agent: unifies data-lake source families behind a single Source Protocol."
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "wormbase-ledger",
    "wormbase-reactivities",
    "wormbase-lake-surfaces",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-reactivities = { workspace = true }
wormbase-lake-surfaces = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_lake_maintainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
