[project]
name = "wormbase-governance"
version = "0.1.0"
description = "WormBase governance — 5 entities as ledger projections, gate implementations."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "wormbase-ledger",
    "wormbase-ontology-seed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services",
    "reproducibility: hash-chain and replay determinism tests",
    "service: single-service integration with real dependencies",
    "demo: demo gate / acceptance criteria tests",
    "slow: tests that take >5s",
]

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-ontology-seed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_governance"]
