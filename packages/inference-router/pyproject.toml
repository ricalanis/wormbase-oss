[project]
name = "wormbase-inference-router"
version = "0.1.0"
description = "WormBase inference router — Kimi (remote) + Gemma VLAN (own), with deterministic cache."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "wormbase-ledger",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    # Used by test_decision_adapter.py to assert Protocol conformance
    # against the in-tree LLMClient consumer surface.
    "wormbase-process-extractor",
]

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-process-extractor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_inference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
