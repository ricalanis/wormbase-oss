[project]
name = "wormbase-catalog-mirror"
version = "0.1.0"
description = "WormBase catalog-mirror — data-plane Protocol for importing upstream lake structure (schemas, lineage, policies, metrics) into the ledger."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "snowflake-connector-python>=3.13.0",
    "wormbase-ledger",
    "wormbase-reactivities",
    "wormbase-lake-maintainer",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-reactivities = { workspace = true }
wormbase-lake-maintainer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_catalog_mirror"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
