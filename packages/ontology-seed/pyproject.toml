[project]
name = "wormbase-ontology-seed"
version = "0.1.0"
description = "WormBase ontology seed packs — SaaS / marketplace / fintech concept catalogs, PII patterns, policy templates, domain templates."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_ontology_seed"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "wormbase_ontology_seed/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services",
    "reproducibility: hash-chain and replay determinism tests",
    "service: single-service integration with real dependencies",
    "demo: demo gate / acceptance criteria tests",
    "slow: tests that take >5s",
]
