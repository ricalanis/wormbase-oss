[project]
name = "wormbase-process-extractor"
version = "0.1.0"
description = "Process-worm: silver/gold conversation artifact synthesis as W5a Reactivities."
requires-python = ">=3.12"

dependencies = [
    "wormbase-ledger",
    "wormbase-reactivities",
    "wormbase-inference-router",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-reactivities = { workspace = true }
wormbase-inference-router = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_process_extractor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
