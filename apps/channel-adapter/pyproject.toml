[project]
name = "wormbase-channel-adapter"
version = "0.1.0"
description = "WormBase channel-ledger adapter — tails OpenClaw session JSONL, writes chat_received/chat_sent ledger entries."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "wormbase-ledger",
    "wormbase-channel-adapters",
    # Silent-mode boot log + dm.send_resource_conversation_dm gate
    # (silent-mode merge 5a70563) import `from wormbase_core import
    # silent_mode`. wormbase-worm-core is the canonical home of the
    # silent-mode reader/helpers shared across apps.
    "wormbase-worm-core",
    "click>=8.1",
    "slack-sdk>=3.27",
    # slack-sdk's async client (used by the Path 3 capture path to call
    # conversations.history) requires aiohttp at runtime — it's not a
    # hard dep of the slack-sdk package itself.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
wormbase-channel-adapter = "wormbase_channel_adapter.cli:main"

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-channel-adapters = { workspace = true }
wormbase-worm-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services",
    "reproducibility: hash-chain and replay determinism tests",
    "service: single-service integration with real dependencies",
    "demo: demo gate / acceptance criteria tests",
    "slow: tests that take >5s",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_channel_adapter"]
