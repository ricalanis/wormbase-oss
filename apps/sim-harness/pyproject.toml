[project]
name = "wormbase-sim-harness"
version = "0.1.0"
description = "WormBase sim harness — bot personas, clock controller, demo-run CLI."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "click>=8.1",
    "slack-sdk>=3.27",
    # slack-sdk's AsyncWebClient pulls aiohttp at runtime; declare it
    # explicitly to avoid surprise import errors on slim images.
    "aiohttp>=3.9",
    "pyyaml>=6",
    "httpx>=0.27",
    "wormbase-ledger",
    # Real tenant seeding (`wormbase demo seed`) reuses CompanyWarmup
    # from governance + tenant_to_uuid/slack_user_to_person from worm-core.
    # The ontology Loader is a worm-core transitive dep but pinned here
    # because the seed module imports it directly.
    "wormbase-worm-core",
    "wormbase-governance",
    "wormbase-ontology-seed",
    # DEMO.1.C — `wormbase demo populate-cache` pre-populates the
    # inference-router sqlite cache for the Acme demo (cache-only mode).
    "wormbase-inference-router",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
wormbase = "wormbase_sim_harness.cli:main"

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-worm-core = { workspace = true }
wormbase-governance = { workspace = true }
wormbase-ontology-seed = { workspace = true }
wormbase-inference-router = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_sim_harness"]
