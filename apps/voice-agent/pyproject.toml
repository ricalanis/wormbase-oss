[project]
name = "wormbase-voice-agent"
version = "0.1.0"
description = "WormBase voice agent — bridges ElevenLabs Conversational AI to the WormBase ledger and Kimi-via-Ollama brain. Phone is just another channel."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
    "wormbase-ledger",
    # P13 — voice-agent calls worm-core's MCP server for KPI lookups so
    # the "Ask the worm" floater answers with a real ledger citation.
    # Transitively pulls anyio + Starlette already pinned by FastAPI.
    "mcp>=1.27.0",
    # Silent-mode boot log + /webhook/elevenlabs gate (silent-mode merge
    # 5a70563) import `from wormbase_core import silent_mode`.
    # wormbase-worm-core is the canonical home of the silent-mode
    # reader/helpers shared across apps.
    "wormbase-worm-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "asgi-lifespan>=2.1",
]

[project.scripts]
wormbase-voice-agent = "wormbase_voice_agent.cli:main"

[tool.uv.sources]
wormbase-ledger = { workspace = true }
wormbase-worm-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch external services (ElevenLabs, Kimi)",
    "reproducibility: hash-chain tests that include voice entries",
    "service: single-service tests with real dependencies",
    "demo: demo gate / acceptance criteria tests",
    "slow: tests that take >5s",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wormbase_voice_agent"]
