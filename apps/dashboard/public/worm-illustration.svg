<?xml version="1.0" encoding="UTF-8"?>
<!--
  WormBase — naturalist illustration of Lumbricus terrestris (the common earthworm).
  Drawn in the spirit of Ernst Haeckel's Kunstformen der Natur (1899–1904) and
  Humboldt's flora plates: thin rule work, anatomical segmentation, hand-inked.
  No fill — this is a line drawing, meant to sit on paper.

  Style notes:
  - Segmentation (annuli) shown as fine arcs across the body.
  - Clitellum (the thickened reproductive band, segments 32–37) shown as
    a slightly darker ring, as is traditional in 19th-century plates.
  - Taxon label hand-set in serif below, as on scientific plates.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 360"
  width="100%"
  height="auto"
  role="img"
  aria-label="Anatomical line drawing of an earthworm, Lumbricus terrestris"
>
  <defs>
    <style>
      .ink { stroke: #2A2A2A; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke-width: 0.9; }
      .mid { stroke-width: 1.1; }
      .thick { stroke-width: 1.6; }
      .label-serif { font-family: "Tiempos Text", "Source Serif 4", "Source Serif Pro", Georgia, serif; fill: #2A2A2A; }
      .label-mono { font-family: "Berkeley Mono", "JetBrains Mono", ui-monospace, monospace; fill: #7A7A7A; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- main body: a long curving segmented worm drawn with two parallel curves -->
  <g>
    <!-- dorsal outline -->
    <path class="ink thick"
      d="M 60 210
         C 120 150, 200 150, 250 180
         C 295 208, 310 250, 360 240
         C 420 228, 470 180, 520 192"
    />
    <!-- ventral outline -->
    <path class="ink thick"
      d="M 62 230
         C 122 178, 200 180, 252 206
         C 295 228, 312 272, 360 262
         C 420 250, 472 205, 522 218"
    />

    <!-- anterior cap (prostomium) — the mouth end -->
    <path class="ink mid"
      d="M 58 210 Q 50 220, 60 230"
    />

    <!-- posterior cap -->
    <path class="ink mid"
      d="M 520 192 Q 530 205, 522 218"
    />

    <!-- segmentation: ~52 fine cross-arcs along the body -->
    <!-- anterior segments (finer spacing) -->
    <g class="ink fine">
      <path d="M 72 213 Q 72 220, 72 228" />
      <path d="M 84 206 Q 85 215, 85 225" />
      <path d="M 96 198 Q 98 208, 98 220" />
      <path d="M 108 191 Q 110 202, 111 215" />
      <path d="M 120 185 Q 122 196, 124 211" />
      <path d="M 132 180 Q 134 193, 137 207" />
      <path d="M 144 175 Q 147 189, 150 204" />
      <path d="M 156 170 Q 160 186, 163 202" />
      <path d="M 168 166 Q 172 183, 176 200" />
      <path d="M 180 163 Q 184 181, 189 199" />
      <path d="M 192 160 Q 197 180, 202 199" />
    </g>

    <!-- clitellum (segments 32–37) — drawn as a thicker band -->
    <g class="ink mid">
      <path d="M 206 160 Q 210 180, 214 200" />
      <path d="M 212 159 Q 216 180, 221 201" />
      <path d="M 220 159 Q 224 181, 229 203" />
      <path d="M 228 160 Q 233 182, 238 205" />
      <path d="M 237 161 Q 242 184, 247 207" />
      <path d="M 246 163 Q 251 186, 256 210" />
    </g>
    <!-- subtle shade band across clitellum -->
    <path class="ink fine" d="M 204 162 Q 232 150, 258 168" />
    <path class="ink fine" d="M 204 206 Q 232 214, 258 214" />

    <!-- mid body segments -->
    <g class="ink fine">
      <path d="M 266 169 Q 272 192, 278 215" />
      <path d="M 278 174 Q 284 199, 290 222" />
      <path d="M 290 180 Q 297 206, 303 230" />
      <path d="M 302 188 Q 309 215, 316 238" />
      <path d="M 314 197 Q 322 225, 330 248" />
      <path d="M 327 207 Q 336 235, 344 256" />
      <path d="M 340 220 Q 350 245, 357 262" />
      <path d="M 354 232 Q 362 250, 370 263" />
    </g>

    <!-- posterior segments, tapering -->
    <g class="ink fine">
      <path d="M 372 238 Q 374 250, 376 262" />
      <path d="M 386 233 Q 388 246, 390 258" />
      <path d="M 400 226 Q 402 238, 405 251" />
      <path d="M 414 218 Q 416 230, 419 244" />
      <path d="M 428 210 Q 431 223, 435 237" />
      <path d="M 442 202 Q 445 215, 450 230" />
      <path d="M 456 196 Q 459 209, 464 224" />
      <path d="M 470 191 Q 473 203, 478 218" />
      <path d="M 484 188 Q 487 199, 492 214" />
      <path d="M 498 188 Q 500 199, 505 213" />
      <path d="M 512 190 Q 514 201, 518 214" />
    </g>

    <!-- setae hints (the small bristles a naturalist would note) -->
    <g class="ink fine">
      <path d="M 110 233 l 0 5" />
      <path d="M 150 228 l 0 5" />
      <path d="M 200 220 l 0 5" />
      <path d="M 260 226 l 0 5" />
      <path d="M 320 252 l 0 5" />
      <path d="M 380 265 l 0 5" />
      <path d="M 440 238 l 0 5" />
      <path d="M 490 218 l 0 5" />
    </g>

    <!-- ground / substrate shading — a hint of soil line -->
    <g class="ink fine" stroke-dasharray="1 3">
      <path d="M 40 295 L 560 295" />
    </g>

    <!-- nomenclature (taxonomic label in serif italic, as on plates) -->
    <text class="label-serif" x="300" y="320" text-anchor="middle"
      font-size="14" font-style="italic" font-weight="500">
      Lumbricus terrestris
    </text>

    <!-- hand-set catalogue number in mono -->
    <text class="label-mono" x="300" y="338" text-anchor="middle" font-size="10">
      FIG. I · PL. I · fam. LUMBRICIDÆ
    </text>
  </g>
</svg>
