<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WormBase — Brand Book Vol. I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:wght@400;500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #222; color: #2A2A2A; font-family: "Source Serif 4", Georgia, serif; }
  deck-stage { --bg: #222; }
  deck-stage section { background: #FAF7F0; position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  deck-stage section > div { position: absolute; inset: 0; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section data-screen-label="00 Cover"><div id="s0"></div></section>
  <section data-screen-label="01 Contents"><div id="s1"></div></section>
  <section data-screen-label="02 The Seal"><div id="s2"></div></section>
  <section data-screen-label="03 Wordmark"><div id="s3"></div></section>
  <section data-screen-label="04 Lockups"><div id="s4"></div></section>
  <section data-screen-label="05 Clear space"><div id="s5"></div></section>
  <section data-screen-label="06 Misuse"><div id="s6"></div></section>
  <section data-screen-label="07 Color on color"><div id="s7"></div></section>
  <section data-screen-label="08 Palette"><div id="s8"></div></section>
  <section data-screen-label="09 Letterforms"><div id="s9"></div></section>
  <section data-screen-label="10 Voice"><div id="s10"></div></section>
  <section data-screen-label="11 Imagery"><div id="s11"></div></section>
  <section data-screen-label="12 Motion"><div id="s12"></div></section>
  <section data-screen-label="13 Stationery"><div id="s13"></div></section>
  <section data-screen-label="14 Slack & icons"><div id="s14"></div></section>
  <section data-screen-label="15 Receipts in the wild"><div id="s15"></div></section>
  <section data-screen-label="16 Colophon"><div id="s16"></div></section>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="brand-logo.jsx"></script>
<script type="text/babel" src="brand-plates.jsx"></script>

<script type="text/babel">
const mounts = [
  ['s0', CoverPlate], ['s1', ContentsPlate], ['s2', SealPlate], ['s3', WordmarkPlate],
  ['s4', LockupPlate], ['s5', ClearspacePlate], ['s6', MisusePlate], ['s7', ColorPairsPlate],
  ['s8', PalettePlate], ['s9', LetterformsPlate], ['s10', VoicePlate], ['s11', ImageryPlate],
  ['s12', MotionPlate], ['s13', StationeryPlate], ['s14', IconsPlate], ['s15', ReceiptsWildPlate],
  ['s16', ColophonPlate],
];
for (const [id, Comp] of mounts) {
  const el = document.getElementById(id);
  if (el) ReactDOM.createRoot(el).render(<Comp />);
}
</script>
</body>
</html>
